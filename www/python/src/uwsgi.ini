[uwsgi]
; ---- Already passed by Toolforge on the command line (kept disabled) ----
; http-socket = :8000
; chdir = %d
; wsgi-file = app.py
; callable = app
; module = app:app
; manage-script-name = true
; die-on-term = true
; (--strict rejects unknown or misspelled options)

master = true
enable-threads = true

; each worker builds the app and the DB engine after fork
lazy-apps = true
single-interpreter = true
need-app = true

; 2 x 4 = 8 concurrent requests
; DB connection ceiling = 2 x (4 + 2) = 12 of max_user_connections = 20
; processes and threads must stay in sync with SQLALCHEMY_ENGINE_OPTIONS
; in the Python config: pool_size == threads, and
; processes * (pool_size + max_overflow) <= 12 (server limit is 20)
processes = 2
threads = 4

thunder-lock = true
post-buffering = 4096

; must be longer than the longest legitimate request
harakiri = 120

; silence errors caused by clients disconnecting early
ignore-sigpipe = true
ignore-write-errors = true
disable-write-exception = true

; periodically recycle workers
max-requests = 2000
max-requests-delta = 200

env = PYTHON_COLORS=0
