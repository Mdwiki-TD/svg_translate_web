{# Shared top navigation tabs for the error logs pages (Bootstrap 5.3) #}
{% set _bp = request.blueprint %}
{% set _ep = request.endpoint %}
<ul class="nav nav-tabs mb-3">
    <li class="nav-item">
        <a class="nav-link {{ 'active' if _ep == _bp ~ '.error_logs' }}"
            {% if _ep == _bp ~ '.error_logs' %}aria-current="page" {% endif %}
            href="{{ url_for(_bp ~ '.error_logs') }}">Error logs</a>
    </li>
    <li class="nav-item">
        <a class="nav-link {{ 'active' if _ep == _bp ~ '.error_logs_statistics' }}"
            {% if _ep == _bp ~ '.error_logs_statistics' %}aria-current="page" {% endif %}
            href="{{ url_for(_bp ~ '.error_logs_statistics') }}">Overall Statistics</a>
    </li>
</ul>
