name: Auto Update Toolforge

on:
    push:
        branches:
            - main
jobs:
    update:
        concurrency:
            group: toolforge-deploy
            cancel-in-progress: false
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Test workspace
              run: |
                  echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"

            - name: Copy files to server
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.KEY }}
                  port: 22
                  source: "./"
                  target: "~/svg_tr_repo_tmp"
                  rm: true

            - name: Deploy on Toolforge
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  port: 22
                  request_pty: true
                  script_stop: true
                  key: ${{ secrets.KEY }}
                  script: |
                      # Define the full source path of the uploaded repository
                      FULL_PATH="/home/${{ secrets.USERNAME }}/svg_tr_repo_tmp"

                      # Execute updater script
                      chmod +x "$FULL_PATH/toolforge/deploy.sh"
                      bash "$FULL_PATH/toolforge/deploy.sh" "$FULL_PATH"

                      echo ">>> Cleaning up temporary repository..."
                      rm -rf "$FULL_PATH"
