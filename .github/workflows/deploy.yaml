name: Auto Update Toolforge

on:
    push:
        branches:
            - main
jobs:
    update:
        concurrency:
            group: toolforge-deploy
            cancel-in-progress: false
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Test workspace
              run: |
                  echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE" # /home/runner/work/svg_translate_web/svg_translate_web # ls -al

            - name: Copy files to server
              uses: appleboy/scp-action@v1.0.0
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  key: ${{ secrets.KEY }}
                  port: 22
                  source: "./"
                  target: "~/svg_tr_repo_tmp"
                  rm: true

            - name: Deploy on Toolforge
              uses: appleboy/ssh-action@v1.2.4
              with:
                  host: ${{ secrets.HOST }}
                  username: ${{ secrets.USERNAME }}
                  port: 22
                  request_pty: true
                  script_stop: true
                  key: ${{ secrets.KEY }}
                  script: |
                      TOOL_NAME="copy-svg-langs"

                      # Define the full source path of the uploaded repository
                      FULL_PATH="/home/${{ secrets.USERNAME }}/svg_tr_repo_tmp"

                      echo ">>> Fixing Windows line endings (CRLF to LF)..."
                      find "$FULL_PATH" -type f -name "*.sh" -exec sed -i 's/\r$//' {} +

                      become "$TOOL_NAME" bash -lc "
                        rm -rf ~/tmp_repo &&
                        cp -r /mnt/nfs/labstore-secondary-tools-home/${{ secrets.USERNAME }}/svg_tr_repo_tmp ~/tmp_repo &&
                        cp -r ~/tmp_repo/toolforge/shs/* ~/shs &&
                        sed -i 's/\r$//' ~/shs/*.sh &&
                        chmod +x ~/shs/*.sh &&
                        toolforge-jobs run update-repo --image python3.13 --command ~/shs/update.sh --wait &&
                        rm -rf ~/tmp_repo &&
                        toolforge-jobs run pipup --image python3.13 --command ~/shs/pip.sh --wait &&
                        toolforge-webservice python3.13 status &&
                        toolforge-webservice python3.13 stop &&
                        toolforge-webservice python3.13 start &&
                        echo ''
                      "
                      rm -rf svg_tr_repo_tmp

                      # ====================
                      # ====================

                      echo ">>> Updating '$TOOL_NAME' tool core repository..."
                      become "$TOOL_NAME" sh -c "cp -rf \"$FULL_PATH/toolforge/deploy_scripts\" /data/project/$TOOL_NAME -v; chmod +x /data/project/$TOOL_NAME/deploy_scripts/*.sh -v; /data/project/$TOOL_NAME/deploy_scripts/update_pop_local.sh \"$FULL_PATH\""

                      echo ">>> Cleaning up temporary repository..."
                      rm -rf "$FULL_PATH"
