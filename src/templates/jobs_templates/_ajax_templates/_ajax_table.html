{% macro new_pages_table(
    table_title,
    job_id,
    job_type,
    list_name,
    table_headers
) %}
<div class="card mb-3">
    <div class="card-header">
        <div class="d-flex flex-column flex-md-row flex-sm-row justify-content-between align-items-md-center">
            <h5 class="mb-0" id="{{ list_name }}-title">
                {{ table_title }} <span id="{{ list_name }}-title-total"></span>
            </h5>
            <div class="card-tools">
                <button type="button" class="btn-tool" data-card-widget="collapse" aria-label="Toggle card">
                    <i class="fas fa-minus"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table id="table-{{ list_name }}" class="table table-striped table-sm w-100 table_text_left" data-ajax-url="{{ url_for(
                    'public_jobs.draw_result_file',
                    job_type=job_type,
                    file_number=job_id,
                    list_name=list_name
                ) }}">
                <thead>
                    <tr>
                        {% for header in table_headers %}
                        <th>{{ header }}</th>
                        {% endfor %}
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
{%- endmacro -%}
